name: build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build — jar, scanJar/checkSignature gates, all test lanes
        run: ./gradlew build

      - uses: actions/upload-artifact@v7
        with:
          name: retrodfu
          path: |
            build/libs/retrodfu-*.jar
            !build/libs/retrodfu-*-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-reports
          path: |
            build/reports/
            build-logic/build/reports/
          retention-days: 7
