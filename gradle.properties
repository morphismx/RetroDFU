# All version numbers live in gradle/libs.versions.toml; upstream DFU's own
# dependencies come from the upstream/ included build, not here.
# JDKs for the test matrix and downgraded runs are supplied via env vars; never auto-download.
org.gradle.java.installations.fromEnv=JAVA8_HOME,JAVA_HOME_8_X64,JAVA25_HOME,JAVA_HOME_25_X64
org.gradle.java.installations.auto-download=false
# Speed up rebuilds: build cache + configuration cache.
org.gradle.caching=true
org.gradle.configuration-cache=true
